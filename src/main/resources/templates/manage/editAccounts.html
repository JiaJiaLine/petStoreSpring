<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Account - MyPetStore</title>
    <link rel="StyleSheet" href="css/mypetstore.css" type="text/css" media="screen"/>
</head>
<body>

<header th:replace="common/top"></header>

<div id="Content">
    <div id="Catalog">

            <form th:action="@{/manage/updateAccount(username=${loginAccount.username})}" method="post">
<div>
    <h3>Account Information</h3>

    <table>
        <tr>
            <td>First name:</td>
            <td>
                <input type="text" name="firstName" th:value="${loginAccount.firstName}">
            </td>
        </tr>
        <tr>
            <td>Last name:</td>
            <td>
                <input type="text" name="lastName" th:value="${loginAccount.lastName}">
            </td>
        </tr>
        <tr>
            <td>Email:</td>
            <td>
                <input type="text" name="email" th:value="${loginAccount.email}">
            </td>
        </tr>
        <tr>
            <td>Phone:</td>
            <td>
                <input type="text" name="phone" th:value="${loginAccount.phone}">
            </td>
        </tr>
        <tr>
            <td>Address 1:</td>
            <td>
                <input type="text" name="address1" th:value="${loginAccount.address1}">
            </td>
        </tr>
        <tr>
            <td>Address 2:</td>
            <td>
                <input type="text" name="address2" th:value="${loginAccount.address2}">
            </td>
        </tr>
        <tr>
            <td>City:</td>
            <td>
                <input type="text" name="city" th:value="${loginAccount.city}">
            </td>
        </tr>
        <tr>
            <td>State:</td>
            <td>
                <input type="text" name="state" th:value="${loginAccount.state}">
            </td>
        </tr>
        <tr>
            <td>Zip:</td>
            <td>
                <input type="text" name="zip" th:value="${loginAccount.zip}">
            </td>
        </tr>
        <tr>
            <td>Country:</td>
            <td>
                <input type="text" name="country" th:value="${loginAccount.country}">
            </td>
        </tr>
    </table>

    <h3>Profile Information</h3>

    <table>
        <tr>
            <td>Language Preference:</td>
            <td>
                <select name="languagePreference">
                    <option th:each="lang : ${languagePreference}"
                            th:value="${lang}"
                            th:text="${lang}"
                            th:selected="${loginAccount.languagePreference == lang}">
                    </option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Favourite Category:</td>
            <td>
                <select name="favouriteCategoryId">
                    <option th:each="favourite : ${favouriteCategoryId}"
                            th:value="${favourite}"
                            th:text="${favourite}"
                            th:selected="${loginAccount.favouriteCategoryId == favourite}">
                    </option>
                </select>
            </td>
        </tr>
        <tr>
            <td>Enable MyList</td>
            <td>
                <input type="checkbox" name="listOption" value="true"
                       th:checked="${loginAccount.listOption}">
            </td>
        </tr>
        <tr>
            <td>Enable MyBanner</td>
            <td>
                <input type="checkbox" name="bannerOption" value="true"
                       th:checked="${loginAccount.bannerOption}">
            </td>
        </tr>
    </table>
</div>


            <input type="submit" name="editAccount" value="Save Account Information">
        </form>

    </div>
</div>



<footer th:replace="common/bottom "></footer>

</body>
</html>
